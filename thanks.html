<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Application received — Sophic Rentals</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#08090B;--surface:#15181D;--line:#262B33;--text:#F4F6F8;--muted:#9AA1AC;--accent:#00E0A4;--accent-ink:#04140F}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:48px 40px;max-width:520px;text-align:center}
  .check{width:64px;height:64px;border-radius:50%;background:rgba(0,224,164,.14);color:var(--accent);display:grid;place-items:center;font-size:30px;margin:0 auto 22px;border:1px solid rgba(0,224,164,.35)}
  h1{font-size:26px;font-weight:900;letter-spacing:-.02em}
  p{color:var(--muted);margin-top:12px;font-size:15px;line-height:1.6}
  .ref{margin-top:18px;font-size:13px;color:var(--muted)}
  .ref b{color:var(--accent);font-size:16px;letter-spacing:.06em}
  a.btn{display:inline-block;margin-top:26px;background:linear-gradient(120deg,#00E0A4,#19B6FF);color:var(--accent-ink);font-weight:700;text-decoration:none;border-radius:999px;padding:12px 24px;font-size:14px}
</style>
</head>
<body>
  <div class="card">
    <div class="check" aria-hidden="true">✓</div>
    <h1>Payment received — you're all set!</h1>
    <p>Thanks for applying to Sophic Rentals. We'll verify your license and insurance and reach out within 24–48 hours to confirm your car and schedule pickup. Keep an eye on your phone and email.</p>
    <div class="ref" id="refRow" style="display:none">Your reference number: <b id="refNum"></b></div>
    <a class="btn" href="/">Back to the site</a>
  </div>
  <script>
    var ref = new URLSearchParams(location.search).get('ref');
    if (ref && /^[A-Za-z0-9-]{4,40}$/.test(ref)) {
      document.getElementById('refNum').textContent = ref;
      document.getElementById('refRow').style.display = 'block';
    }
  </script>
</body>
</html>
